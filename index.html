    <button class="btn ghost sm" id="todayMonth" title="이번 달 · 오늘로">오늘</button>
  </label>
  <span id="saveState" class="save-state"></span>
  <button id="settingsTopBtn" class="btn sm secbtn" type="button" hidden>설정</button>
</header>
<nav class="tabs no-print" id="tabs" aria-label="주요 메뉴">

    <button class="nav-item" data-tab="budget"><span class="nav-copy"><b>예산·손익</b></span></button>
