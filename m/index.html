<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유성 영수증</title>
<meta name="theme-color" content="#2b59c3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="유성 영수증">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<!-- manifest 는 m.js 가 붙임 (아이폰은 붙이지 않음: 홈 화면에 추가할 때 지금 주소(설치 열쇠 포함)가 그대로 담기게) -->
<style>
:root{--ink:#1d2430;--muted:#6b7684;--line:#e2e6ec;--bg:#f4f6f9;--card:#fff;--accent:#2b59c3;--accent-soft:#edf2fd;--bad:#c03636;--bad-soft:#fdefef;--ok:#177245;--ok-soft:#e9f6ef;--warn:#9a6700;--warn-soft:#fff6e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{padding:0 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 10px}
header img{width:32px;height:32px;border-radius:8px}
header h1{font-size:18px;margin:0;flex:1}
header button{border:0;background:none;font-size:22px;padding:4px 6px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600}
.site{font-size:20px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:17px;font-weight:600;padding:10px 14px;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{min-height:76px;font-size:20px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:48px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:90px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.thumbs .th{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.thumbs .th>span{position:relative;display:block;aspect-ratio:3/4;background:#dde2ea}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .th>span b{position:absolute;left:5px;top:5px;min-width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:22px;text-align:center;padding:0 5px}
.thumbs .th>span em{position:absolute;right:5px;bottom:5px;border-radius:8px;background:var(--ok);color:#fff;font-size:11px;font-style:normal;padding:2px 6px}
.thumbs .th>span em:empty{display:none}
.thumbs .th>span em.au{background:var(--accent)}
.thumbs .th>span em.wk{background:rgba(0,0,0,.65)}
.thumbs .th>div{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.thumbs .th>div button{border:0;background:#fff;font-size:14px;font-weight:600;padding:9px 0;font-family:inherit}
.thumbs .th>div button.ed{color:var(--accent);background:var(--accent-soft)}
.thumbs .th>div button.dl{color:var(--bad);background:var(--bad-soft);border-left:1px solid var(--line)}
.muted{color:var(--muted);font-size:14px}
.note{border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:15px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note .btn{margin-top:8px;min-height:44px;font-size:15px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.hide{display:none!important}
.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));background:#1d2430;color:#fff;padding:14px 16px;border-radius:12px;font-size:15px;text-align:center;z-index:9}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin:4px 0}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1>유성 영수증</h1><button id="menuBtn" type="button" aria-label="설정" class="hide">⚙</button></header>
<main id="app"><p class="muted">불러오는 중…</p></main>
<input type="file" id="camIn" accept="image/*" capture="environment" class="hide">
<input type="file" id="picIn" accept="image/*" multiple class="hide">
<script src="scan.js"></script>
<script src="cam.js"></script>
<script src="m.js"></script>
</body>
</html>
